title: "Sunghwan Kim"
description: "M.S. student at Language and AGI Lab researching language agents, reinforcement learning, and interactive learning systems."
url: "https://kimsh0507.github.io"
baseurl: ""

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:slug/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      sitemap: false

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - PLAN.md
  - "*.sh"
