<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{% assign noindex_post = false %}
{% if page.layout == "post" and page.visible != true %}
{% assign noindex_post = true %}
{% endif %}
{% if page.secret or page.hidden or noindex_post %}
<meta name="robots" content="noindex, nofollow" />
{% endif %}
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    var preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", saved || preferred || "dark");
  })();
</script>
{% seo %}
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
