<header class="site-header">
  <nav class="nav" aria-label="main navigation">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.config.name }}</a>
    <div class="nav-actions">
      <div class="nav-links" id="site-menu">
        <a class="nav-link" href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>About</a>
        <a class="nav-link" href="{{ '/publication/' | relative_url }}" {% if page.url contains '/publication' %}aria-current="page"{% endif %}>Publication</a>
        <a class="nav-link" href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}aria-current="page"{% endif %}>Blog</a>
      </div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch theme">
        <svg id="icon-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
        <svg id="icon-moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
      </button>
      <button class="menu-button" type="button" data-menu-toggle aria-controls="site-menu" aria-expanded="false" aria-label="Open menu">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>
  </nav>
</header>
