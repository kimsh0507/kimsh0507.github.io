---
layout: default
---

<header class="page-header fade-in">
  {% if page.kicker %}
  <p class="page-kicker">{{ page.kicker }}</p>
  {% endif %}
  <h1 class="page-title">{{ page.title }}</h1>
  {% if page.description %}
  <p class="page-description">{{ page.description }}</p>
  {% endif %}
</header>

{{ content }}
