  <p>
    Hi! I am a second year M.S. student at Yonsei University advised by Jinyoung Yeo.
    Previously, I received my B.S. in Materials Science &amp; Engineering from Yonsei University in August 2024.
  </p>
  <p>
    I aim to build human-like intelligent systems that can autonomously learn, reason, and adapt to diverse environments.
    My recent research interests include reinforcement learning for long-horizon tasks and intelligent systems that learn through interaction with their environments.
  </p>

