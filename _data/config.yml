bio: >
  <p>
    Hi! I am a second year M.S. student at Yonsei University advised by Jinyoung Yeo.
    Previously, I received my B.S. in Materials Science &amp; Engineering from Yonsei University in August 2024.
  </p>
  <p>
    My research aims to build <strong>self-improving AI systems</strong>: agents that continue to learn after deployment while remaining controllable by and interpretable to humans.
    I pursue this goal along three coupled axes: shaping the <strong>environments</strong> that determine both the data agents learn from and the rewards that guide them, developing <strong>agents</strong> that direct their own behavior with adaptive and meta-cognitive policie, and analyzing the learning dynamics that make self-improvement reliable rather than accidental.
    My broader goal is to move beyond static, once-trained models toward agents that safely learn to improve themselves over a lifetime, with <strong>personalization</strong> and <strong>scientific discovery</strong> as the primary settings.
  </p>

